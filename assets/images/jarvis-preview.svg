<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Telegram Dark Theme Background -->
    <linearGradient id="tg-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1621"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>

    <!-- User Message Bubble (Telegram Blue) -->
    <linearGradient id="tg-user-bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5278"/>
      <stop offset="100%" stop-color="#1e3b56"/>
    </linearGradient>

    <!-- Bot Message Bubble (Telegram Dark Navy) -->
    <linearGradient id="tg-bot-bubble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182533"/>
      <stop offset="100%" stop-color="#131c26"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="tg-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Canvas Frame -->
  <rect width="1200" height="675" fill="#070a0f"/>

  <!-- Telegram Desktop Client Window -->
  <g transform="translate(60, 25)" filter="url(#tg-shadow)">
    <!-- Window Border & Outer Shell -->
    <rect width="1080" height="625" rx="16" fill="url(#tg-bg)" stroke="#222e3d" stroke-width="1.5"/>

    <!-- Telegram Header Bar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 1064 0 C 1072.84 0 1080 7.16 1080 16 L 1080 62 L 0 62 Z" fill="#17212b"/>
    <line x1="0" y1="62" x2="1080" y2="62" stroke="#222e3d" stroke-width="1"/>

    <!-- Window Controls (Mac/Unix style dots) -->
    <circle cx="28" cy="31" r="5.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="46" cy="31" r="5.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="64" cy="31" r="5.5" fill="#10b981" opacity="0.8"/>

    <!-- Telegram Back Arrow / Menu Icon -->
    <g transform="translate(95, 22)" stroke="#708499" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="9" x2="14" y2="9"/>
      <polyline points="7,2 0,9 7,16"/>
    </g>

    <!-- Bot Avatar -->
    <g transform="translate(130, 11)">
      <circle cx="20" cy="20" r="20" fill="#2481cc"/>
      <!-- Robot / AI Avatar Icon -->
      <path d="M 12 16 L 28 16 C 29.5 16 30.5 17 30.5 18.5 L 30.5 25.5 C 30.5 27 29.5 28 28 28 L 12 28 C 10.5 28 9.5 27 9.5 25.5 L 9.5 18.5 C 9.5 17 10.5 16 12 16 Z" fill="#ffffff" opacity="0.95"/>
      <circle cx="16" cy="21.5" r="2.2" fill="#2481cc"/>
      <circle cx="24" cy="21.5" r="2.2" fill="#2481cc"/>
      <line x1="20" y1="11" x2="20" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="20" cy="10" r="2" fill="#ffffff"/>
      <line x1="16" y1="25" x2="24" y2="25" stroke="#2481cc" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Header Bot Name & Status -->
    <g transform="translate(182, 18)">
      <div style="display: flex; align-items: center;">
        <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Jarvis Personal Executive</text>
        <rect x="185" y="4" width="32" height="15" rx="3" fill="#2481cc" fill-opacity="0.3"/>
        <text x="189" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#4fa7e8">BOT</text>
      </div>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#4fa7e8">en línea · Groq Qwen-2.5 27B · Docker Active</text>
    </g>

    <!-- Top Right Action Icons (Search, Mute, Menu) -->
    <g transform="translate(970, 20)">
      <!-- Search Icon -->
      <circle cx="12" cy="11" r="5" stroke="#708499" stroke-width="1.8" fill="none"/>
      <line x1="16" y1="15" x2="22" y2="21" stroke="#708499" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Vertical Dots Menu -->
      <circle cx="55" cy="6" r="2" fill="#708499"/>
      <circle cx="55" cy="12" r="2" fill="#708499"/>
      <circle cx="55" cy="18" r="2" fill="#708499"/>
    </g>

    <!-- Telegram Chat Body Wallpaper Pattern (Subtle geometric/chat doodles) -->
    <g opacity="0.04" stroke="#ffffff" stroke-width="1.2" fill="none">
      <path d="M 120 120 C 140 100 160 140 180 120"/>
      <circle cx="340" cy="160" r="14"/>
      <rect x="780" y="110" width="20" height="20" rx="4"/>
      <polygon points="560,180 575,200 545,200"/>
      <path d="M 850 320 C 870 300 890 340 910 320"/>
      <circle cx="160" cy="420" r="12"/>
      <rect x="420" y="460" width="18" height="18" rx="3"/>
      <polygon points="980,440 995,460 965,460"/>
    </g>

    <!-- Date Bubble: "Hoy" -->
    <g transform="translate(500, 76)">
      <rect width="80" height="22" rx="11" fill="#182533" fill-opacity="0.8" stroke="#253549" stroke-width="0.8"/>
      <text x="40" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#8ca0b3" text-anchor="middle">Hoy</text>
    </g>

    <!-- ================= CHAT MESSAGE THREAD ================= -->

    <!-- MESSAGE 1: Bot Proactive Morning Briefing (Cron: 08:00 AM) -->
    <g transform="translate(40, 108)">
      <!-- Bubble Card -->
      <path d="M 10 0 L 680 0 C 690 0 690 10 690 10 L 690 196 C 690 206 680 206 680 206 L 0 206 L 0 10 C 0 0 10 0 10 0 Z" fill="url(#tg-bot-bubble)" stroke="#243447" stroke-width="1"/>
      
      <!-- Content Header -->
      <text x="22" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#f59e0b">☀️ BRIEFING MATUTINO PROACTIVO · 08:00 AM</text>
      <text x="22" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#e1e7ed"><tspan font-weight="600">Buenos días, David.</tspan> Resumen de agenda y compromisos de hoy:</text>
      
      <!-- Agenda Bullets -->
      <g transform="translate(22, 68)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c3d1de">
        <text x="0" y="0">📅 <tspan font-weight="600" fill="#60a5fa">10:00 - 13:00</tspan> | Laboratorio UniBo: Modelos Generativos</text>
        <text x="0" y="20">📅 <tspan font-weight="600" fill="#60a5fa">16:30 - 17:30</tspan> | Sesión de revisión TFG: Flow Matching Retiniano</text>
        <text x="0" y="40">🏋️‍♂️ <tspan font-weight="600" fill="#34d399">Rutina Propuesta:</tspan> Fuerza Tren Superior (Día B) - 18:30 h</text>
        <text x="0" y="60">💊 <tspan font-weight="600" fill="#f87171">Medicación:</tspan> Dosis matinal pendiente de confirmación</text>
        <text x="0" y="80">📌 <tspan font-weight="600" fill="#a78bfa">Deadlines:</tspan> 1 entrega periódica antes de las 23:59 h</text>
      </g>

      <!-- Timestamp -->
      <text x="645" y="196" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#687e94">08:00</text>

      <!-- Inline Keyboard Buttons for Morning Briefing -->
      <g transform="translate(0, 214)">
        <rect width="220" height="34" rx="8" fill="#1f2c3d" stroke="#2d3f54" stroke-width="1"/>
        <text x="26" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#4fa7e8">💊 Confirmar Medicación</text>

        <rect x="230" width="220" height="34" rx="8" fill="#1f2c3d" stroke="#2d3f54" stroke-width="1"/>
        <text x="265" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#4fa7e8">📅 Ver Google Calendar</text>

        <rect x="460" width="230" height="34" rx="8" fill="#1f2c3d" stroke="#2d3f54" stroke-width="1"/>
        <text x="495" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#4fa7e8">⏱ Posponer Alerta 30m</text>
      </g>
    </g>

    <!-- MESSAGE 2: User Prompt (Telegram Blue Bubble on Right) -->
    <g transform="translate(480, 375)">
      <path d="M 10 0 L 550 0 C 560 0 560 10 560 10 L 560 48 C 560 56 550 56 550 56 L 0 56 L 0 10 C 0 0 10 0 10 0 Z" fill="url(#tg-user-bubble)"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#ffffff">He terminado el lab antes. Agenda entreno de escalada a las</text>
      <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#ffffff">18:00 y confirma la toma de medicación del día.</text>
      
      <!-- Read Double Checkmark & Timestamp -->
      <g transform="translate(508, 45)">
        <text x="0" y="0" font-family="sans-serif" font-size="10" fill="#8cb9df">14:24</text>
        <!-- Blue checkmarks -->
        <path d="M 32 -3 L 36 1 L 43 -6" stroke="#4fa7e8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M 36 -3 L 40 1 L 47 -6" stroke="#4fa7e8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- MESSAGE 3: Bot Autonomous Execution & Tool Calling -->
    <g transform="translate(40, 442)">
      <!-- Bubble Card -->
      <path d="M 10 0 L 690 0 C 700 0 700 10 700 10 L 700 115 C 700 124 690 124 690 124 L 0 124 L 0 10 C 0 0 10 0 10 0 Z" fill="url(#tg-bot-bubble)" stroke="#243447" stroke-width="1"/>
      
      <!-- Tool Execution Pill Badge -->
      <g transform="translate(20, 14)">
        <rect width="400" height="22" rx="6" fill="#13202e" stroke="#2a4159" stroke-width="1"/>
        <circle cx="12" cy="11" r="3.5" fill="#38bdf8"/>
        <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8">TOOL: google_calendar_insert_event() [OK · 182ms]</text>
      </g>

      <!-- Bot Answer Text -->
      <g transform="translate(20, 52)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#e1e7ed">
        <text x="0" y="0">✔ <tspan font-weight="700" fill="#ffffff">Entrenamiento de Escalada</tspan> programado en Google Calendar (18:00 - 19:30).</text>
        <text x="0" y="20">✔ <tspan font-weight="700" fill="#ffffff">Medicación validada en 2FA</tspan>: Registro actualizado en PostgreSQL 16.</text>
        <text x="0" y="40" fill="#93c5fd">Tasa semanal de adherencia: 100%. Te recordaré la hidratación a las 17:45.</text>
      </g>

      <!-- Timestamp -->
      <text x="655" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#687e94">14:24</text>
    </g>

    <!-- Telegram Bottom Input Message Bar -->
    <g transform="translate(0, 574)">
      <rect width="1080" height="51" fill="#17212b"/>
      <line x1="0" y1="0" x2="1080" y2="0" stroke="#222e3d" stroke-width="1"/>

      <!-- Paperclip Icon (Attach) -->
      <g transform="translate(28, 16)" stroke="#708499" stroke-width="1.8" fill="none" stroke-linecap="round">
        <path d="M 14 8 L 8 14 C 5.5 16.5 5.5 20.5 8 23 C 10.5 25.5 14.5 25.5 17 23 L 24 16 C 25.5 14.5 25.5 12 24 10.5 C 22.5 9 20 9 18.5 10.5 L 12 17"/>
      </g>

      <!-- Input Text Field -->
      <rect x="66" y="8" width="940" height="35" rx="17.5" fill="#0f1621" stroke="#243447" stroke-width="1"/>
      <text x="86" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#687e94">Escribe un mensaje a Jarvis...</text>

      <!-- Emoji / Microphone Icon -->
      <circle cx="985" cy="25" r="8" stroke="#708499" stroke-width="1.5" fill="none"/>
      <circle cx="982" cy="23" r="1" fill="#708499"/>
      <circle cx="988" cy="23" r="1" fill="#708499"/>
      <path d="M 982 27 Q 985 30 988 27" stroke="#708499" stroke-width="1.3" fill="none" stroke-linecap="round"/>

      <!-- Voice / Send Button -->
      <circle cx="1040" cy="25" r="15" fill="#2481cc"/>
      <!-- Mic symbol -->
      <rect x="1037" y="17" width="6" height="10" rx="3" fill="#ffffff"/>
      <path d="M 1035 22 C 1035 26 1045 26 1045 22" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <line x1="1040" y1="26" x2="1040" y2="30" stroke="#ffffff" stroke-width="1.5"/>
    </g>

  </g>
</svg>
