      <text x="14" y="44" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• Captura Sinks Históricos</text>
      <text x="14" y="60" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• Desacoplamiento Eventos</text>
      <text x="14" y="76" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• Base de Datos Relacional</text>
      <text x="14" y="92" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• Series Temporales Longit.</text>
