    <text x="12" y="15" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">STACK: Pentaho PDI (Kettle) · FIWARE Orion Context Broker · FIWARE Cygnus · URBO Dashboard (CDE) · OLAP / JPivot · SEGITTUR DTI</text>
