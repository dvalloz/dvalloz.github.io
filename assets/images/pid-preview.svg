      <text x="14" y="36" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• Community Dashboard Editor</text>
      <text x="14" y="50" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• KPIs en tiempo real</text>
      <text x="14" y="64" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• Visualización cartográfica</text>
      <text x="14" y="78" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• Inteligencia territorial PID</text>
