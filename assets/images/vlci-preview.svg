      <text x="14" y="36" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• Coordinación entre áreas</text>
      <text x="14" y="50" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• Detección de averías/ruido</text>
      <text x="14" y="64" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9">• Eficiencia energética pedanías</text>
