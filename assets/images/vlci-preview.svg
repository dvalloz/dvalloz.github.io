    <text x="12" y="15" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">STACK: FIWARE Orion Context Broker · FIWARE Cygnus · Pentaho Data Integration · URBO CDE · Red.es / Ayto. de València</text>
