<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161824"/>
      <stop offset="100%" stop-color="#10121b"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chart-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="175" x2="1200" y2="175"/>
    <line x1="0" y1="275" x2="1200" y2="275"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="475" x2="1200" y2="475"/>
    <line x1="0" y1="575" x2="1200" y2="575"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- App Window Container -->
  <g transform="translate(60, 40)" filter="url(#subtle-shadow)">
    <!-- App frame -->
    <rect width="1080" height="595" rx="16" fill="#0d0f17" stroke="#25293d" stroke-width="1.5"/>

    <!-- App Header / Window Bar -->
    <rect width="1080" height="54" rx="16" fill="#131622"/>
    <rect y="40" width="1080" height="14" fill="#131622"/>
    <line x1="0" y1="54" x2="1080" y2="54" stroke="#25293d" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="28" cy="27" r="5.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="46" cy="27" r="5.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="64" cy="27" r="5.5" fill="#10b981" opacity="0.8"/>

    <!-- App Title & Navigation -->
    <text x="100" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">FinTrack</text>
    <rect x="175" y="17" width="130" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="187" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#c4b5fd">Next.js 15 App Router</text>

    <!-- Header Status Badges -->
    <g transform="translate(860, 16)">
      <rect width="180" height="24" rx="12" fill="#1e2235" stroke="#333852" stroke-width="1"/>
      <circle cx="16" cy="12" r="3.5" fill="#10b981"/>
      <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">Open Banking PSD2 · Sync</text>
    </g>

    <!-- Sidebar (Left) -->
    <g transform="translate(0, 54)">
      <rect width="210" height="541" fill="#10121c"/>
      <line x1="210" y1="0" x2="210" y2="541" stroke="#25293d" stroke-width="1"/>

      <!-- Navigation Items -->
      <g transform="translate(16, 24)">
        <!-- Item 1 (Active) -->
        <rect width="178" height="36" rx="8" fill="#8b5cf6" fill-opacity="0.15"/>
        <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#a78bfa">Dashboard Neto</text>
        <circle cx="22" cy="18" r="4" fill="#8b5cf6"/>

        <!-- Item 2 -->
        <text x="38" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">Cuentas Bancarias (3)</text>
        <!-- Item 3 -->
        <text x="38" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">Splits &amp; Bizum</text>
        <!-- Item 4 -->
        <text x="38" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">Patrimonio Histórico</text>
        <!-- Item 5 -->
        <text x="38" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">Reglas de Asignación</text>

        <!-- Architecture note box -->
        <g transform="translate(0, 340)">
          <rect width="178" height="120" rx="10" fill="#161928" stroke="#2a2e45" stroke-width="1"/>
          <text x="14" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#818cf8">// HEXAGONAL CORE</text>
          <text x="14" y="44" font-family="monospace" font-size="9" fill="#94a3b8">• Domain inmutable</text>
          <text x="14" y="60" font-family="monospace" font-size="9" fill="#94a3b8">• Ports &amp; Adapters</text>
          <text x="14" y="76" font-family="monospace" font-size="9" fill="#94a3b8">• Drizzle ORM + PG16</text>
          <text x="14" y="92" font-family="monospace" font-size="9" fill="#94a3b8">• UUIDv7 ordenable</text>
          <rect x="14" y="100" width="80" height="12" rx="3" fill="#10b981" fill-opacity="0.15"/>
          <text x="18" y="109" font-family="monospace" font-size="8" font-weight="600" fill="#34d399">WCAG 2.2 AAA</text>
        </g>
      </g>
    </g>

    <!-- Main Content Area (Right) -->
    <g transform="translate(230, 74)">

      <!-- Top Metric Cards Row (True Net Spend showcase) -->
      <!-- Card 1: Gasto Bruto (Con distorsión) -->
      <g transform="translate(0, 0)">
        <rect width="255" height="100" rx="12" fill="url(#card-grad)" stroke="#272b3f" stroke-width="1"/>
        <text x="18" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">GASTO BRUTO REGISTRADO</text>
        <text x="18" y="62" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#f87171">1.640,00 €</text>
        <text x="18" y="84" font-family="sans-serif" font-size="10" fill="#64748b">Cena, viajes y adelantos compartidos</text>
      </g>

      <!-- Card 2: Reembolsos Bizum / Splits -->
      <g transform="translate(275, 0)">
        <rect width="255" height="100" rx="12" fill="url(#card-grad)" stroke="#272b3f" stroke-width="1"/>
        <text x="18" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="0.5">REEMBOLSOS (BIZUM / SPLIT)</text>
        <text x="18" y="62" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#38bdf8">- 560,00 €</text>
        <text x="18" y="84" font-family="sans-serif" font-size="10" fill="#64748b">Amortización directa a partidas base</text>
      </g>

      <!-- Card 3: TRUE NET SPEND (Hero metric) -->
      <g transform="translate(550, 0)">
        <rect width="270" height="100" rx="12" fill="#1e1838" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="18" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#c4b5fd" letter-spacing="0.5">GASTO NETO REAL (TRUE NET)</text>
        <text x="18" y="62" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="800" fill="#ffffff">1.080,00 €</text>
        <text x="18" y="84" font-family="sans-serif" font-size="10" font-weight="500" fill="#a78bfa">✓ Sin falacia de inflación de gasto</text>
      </g>

      <!-- Main Analytics Chart & Split Engine Preview -->
      <g transform="translate(0, 120)">
        <!-- Chart Box -->
        <rect width="530" height="380" rx="14" fill="url(#card-grad)" stroke="#272b3f" stroke-width="1"/>
        <text x="22" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Evolución de Ahorro &amp; Gasto Neto vs Bruto</text>
        <text x="22" y="50" font-family="sans-serif" font-size="11" fill="#64748b">Cómputo en tiempo real sobre PostgreSQL 16 con vistas analíticas</text>

        <!-- Chart Grid Lines -->
        <g stroke="#262a40" stroke-width="1" stroke-dasharray="3 3" transform="translate(40, 75)">
          <line x1="0" y1="40" x2="460" y2="40"/>
          <line x1="0" y1="100" x2="460" y2="100"/>
          <line x1="0" y1="160" x2="460" y2="160"/>
          <line x1="0" y1="220" x2="460" y2="220"/>
        </g>

        <!-- Chart Filled Area (True Net) -->
        <path d="M 60 250 L 110 230 L 170 210 L 230 220 L 290 180 L 350 170 L 410 140 L 480 120 L 480 300 L 60 300 Z" fill="url(#chart-fill)"/>
        
        <!-- Gross spend line (red/dashed) -->
        <path d="M 60 210 L 110 170 L 170 140 L 230 180 L 290 120 L 350 110 L 410 80 L 480 65" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4 4"/>
        
        <!-- Net spend line (purple solid) -->
        <path d="M 60 250 L 110 230 L 170 210 L 230 220 L 290 180 L 350 170 L 410 140 L 480 120" fill="none" stroke="#a78bfa" stroke-width="3"/>

        <!-- Chart Legend -->
        <g transform="translate(60, 335)">
          <circle cx="6" cy="6" r="4" fill="#a78bfa"/>
          <text x="16" y="9" font-family="sans-serif" font-size="11" fill="#cbd5e1">Gasto Neto Real</text>

          <circle cx="160" cy="6" r="4" fill="#f87171"/>
          <text x="170" y="9" font-family="sans-serif" font-size="11" fill="#94a3b8">Gasto Bruto (Contabilidad clásica)</text>
        </g>
      </g>

      <!-- Live Ledger Transactions (Right Box) -->
      <g transform="translate(550, 120)">
        <rect width="270" height="380" rx="14" fill="url(#card-grad)" stroke="#272b3f" stroke-width="1"/>
        <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Desglose de Operaciones</text>
        <text x="20" y="50" font-family="sans-serif" font-size="11" fill="#64748b">Asociación atómica de cobros</text>

        <!-- Tx 1 -->
        <g transform="translate(16, 70)">
          <rect width="238" height="66" rx="8" fill="#141824" stroke="#25293d" stroke-width="1"/>
          <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Cena de Grupo (Adelanto)</text>
          <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#64748b">Pago con Tarjeta</text>
          <text x="170" y="24" font-family="monospace" font-size="12" font-weight="700" fill="#f87171">- 140,00 €</text>
          <rect x="12" y="46" width="105" height="14" rx="3" fill="#8b5cf6" fill-opacity="0.2"/>
          <text x="16" y="56" font-family="monospace" font-size="8.5" fill="#c4b5fd">Split 4 personas</text>
        </g>

        <!-- Tx 2: Bizum asociado -->
        <g transform="translate(16, 146)">
          <rect width="238" height="54" rx="8" fill="#0d211d" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
          <text x="12" y="20" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#34d399">↳ Bizum: 3 Amigos</text>
          <text x="12" y="36" font-family="sans-serif" font-size="9.5" fill="#6ee7b7">Vinculado a: Cena de Grupo</text>
          <text x="165" y="24" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">+ 105,00 €</text>
          <text x="165" y="42" font-family="monospace" font-size="9" font-weight="600" fill="#94a3b8">Neto: -35 €</text>
        </g>

        <!-- Tx 3: Nómina / Ingreso genuino -->
        <g transform="translate(16, 210)">
          <rect width="238" height="60" rx="8" fill="#141824" stroke="#25293d" stroke-width="1"/>
          <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Transferencia Recibida</text>
          <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#64748b">Ingreso Genuino · Santander</text>
          <text x="156" y="24" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">+ 2.150,00 €</text>
        </g>

        <!-- Balance chip -->
        <g transform="translate(16, 290)">
          <rect width="238" height="70" rx="10" fill="#1b1c2b" stroke="#373b57" stroke-width="1"/>
          <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">Ahorro Mensual Consolidado</text>
          <text x="14" y="52" font-family="monospace" font-size="20" font-weight="800" fill="#ffffff">+ 1.070,00 €</text>
          <text x="145" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#10b981">(+49.7%)</text>
        </g>

      </g>

    </g>
  </g>
</svg>
